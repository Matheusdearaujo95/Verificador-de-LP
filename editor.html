<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigia — Editor de Configuração</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #dfe2e7;
    --text: #1f2430;
    --text-muted: #656e7d;
    --accent: #2b6cb0;
    --accent-dark: #1f5089;
    --ok: #1a7f4b;
    --ok-bg: #e7f7ee;
    --warn: #9a6400;
    --warn-bg: #fff6e0;
    --danger: #b3261e;
    --danger-bg: #fdecea;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--text-muted); font-size: 14px; }

  .wrap { max-width: 920px; margin: 0 auto; padding: 24px; padding-bottom: 120px; }

  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 9px 14px;
    color: var(--text);
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-weight: 600;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.subtle {
    background: transparent;
    border-color: transparent;
    color: var(--text-muted);
    padding: 6px 8px;
  }
  button.subtle:hover { color: var(--danger); }
  button.small { padding: 5px 10px; font-size: 13px; }

  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .tab {
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: #eceef1;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 14px;
  }
  .tab.active {
    background: var(--panel);
    color: var(--text);
    font-weight: 600;
  }
  .tab.add {
    background: transparent;
    border-style: dashed;
    color: var(--accent);
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 { margin-top: 0; font-size: 17px; }
  .panel h2 .del-site {
    float: right;
  }
  .panel-hint { color: var(--text-muted); font-size: 13px; margin-top: -8px; margin-bottom: 16px; }

  .field { margin-bottom: 16px; }
  .field label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .field input[type=text], .field input[type=number], .field textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font: inherit;
    font-size: 14px;
    background: #fbfbfc;
  }
  .field input:focus, .field textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    background: white;
  }
  .field .row-inline { display: flex; gap: 8px; align-items: center; }
  .field .row-inline input { flex: 1; }

  .help {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #cfd6de;
    color: white;
    font-size: 11px;
    font-weight: 700;
    cursor: help;
    flex-shrink: 0;
  }

  .subsection {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    background: #fafbfc;
  }
  .subsection > h3 { margin: 0 0 12px; font-size: 14px; }

  .text-list-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .text-list-row input { flex: 1; }

  .bad-text-warning {
    color: var(--danger);
    font-size: 12px;
    margin-top: -4px;
    margin-bottom: 8px;
  }

  .warnings {
    position: sticky;
    bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 14px 24px;
    max-width: 920px;
    margin: 0 auto;
  }
  .warnings.ok { color: var(--ok); }
  .warnings ul { margin: 6px 0 0; padding-left: 20px; }
  .warnings li { color: var(--warn); font-size: 13px; margin-bottom: 3px; }

  .paste-box textarea {
    width: 100%;
    height: 110px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fbfbfc;
  }

  .finding {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .finding.ambiguous { border-color: #e8c468; background: var(--warn-bg); }
  .finding .finding-text { font-size: 14px; }
  .finding .finding-text code {
    background: #eef1f4;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 13px;
  }
  .finding .finding-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .finding.done { opacity: 0.55; }

  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2430;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 50;
  }
  .toast.show { opacity: 1; }

  #load-input { display: none; }
</style>
</head>
<body>

<header>
  <h1>Vigia — Editor de Configuração</h1>
  <p>Preencha os campos abaixo pra gerar o <code>config.json</code> que o monitor usa. Nada aqui se conecta a nada — é só um formulário local, roda inteiro no seu navegador.</p>
</header>

<div class="wrap">
  <div class="toolbar">
    <button id="btn-load" class="small">Carregar existente</button>
    <input type="file" id="load-input" accept="application/json">
    <button id="btn-copy" class="small">Copiar JSON</button>
    <button id="btn-download" class="small primary">Baixar config.json</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="site-panel"></div>
</div>

<div class="warnings" id="warnings"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

// ---------------------------------------------------------------------
// Estado
// ---------------------------------------------------------------------

function newSite(name) {
  return {
    name: name || "",
    domain: "",
    expected_ip: "",
    checkout_url: "",
    ssl_alert_days: 20,
    content_checks: [
      { device: "mobile", url: "", expected_texts: [""] },
      { device: "desktop", url: "", expected_texts: [""] },
    ],
    instagram_bio_url: "",
    instagram_bio_expected_domain: "",
    ad_links: [],
  };
}

const state = {
  sites: [newSite("Meu site")],
  active: 0,
};

// ---------------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------------

const BAD_TEXT_RE = /[←-⇿⌀-➿⬀-⯿\u{1F000}-\u{1FAFF}]/u;
const BAD_TEXT_RE_GLOBAL = /[←-⇿⌀-➿⬀-⯿\u{1F000}-\u{1FAFF}]/gu;

// Pega o texto "de verdade" de um link, ignorando sub-elementos que são só
// ícone decorativo (ex: <span class="arr">→</span> dentro do botão) —
// senão o botão inteiro seria descartado por causa de uma seta que nem faz
// parte do texto que aparece pro visitante como "o texto do botão".
function isPureIcon(text) {
  const t = text.trim();
  if (!t) return true;
  return t.replace(BAD_TEXT_RE_GLOBAL, "").trim() === "";
}

function extractButtonText(el) {
  let out = "";
  for (const node of el.childNodes) {
    if (node.nodeType === Node.TEXT_NODE) {
      out += node.textContent;
    } else if (node.nodeType === Node.ELEMENT_NODE) {
      if (isPureIcon(node.textContent || "")) continue;
      out += extractButtonText(node);
    }
  }
  return out.replace(/\s+/g, " ").trim();
}

const KNOWN_GATEWAYS = [
  "kiwify.com.br", "pay.kiwify.com.br",
  "hotmart.com", "pay.hotmart.com",
  "eduzz.com", "sun.eduzz.com",
  "monetizze.com.br", "app.monetizze.com.br",
  "braip.com", "app.braip.com",
  "perfectpay.com.br",
  "greenn.com.br",
  "ticto.com.br",
  "doppus.com",
  "cartpanda.com",
  "yampi.com.br",
  "vindi.com.br",
  "pagar.me",
  "checkout.stripe.com", "buy.stripe.com",
  "mercadopago.com.br",
];

const NOISE_DOMAINS = [
  "fonts.googleapis.com", "fonts.gstatic.com",
  "www.google.com", "google.com",
  "www.googletagmanager.com", "googletagmanager.com",
  "www.google-analytics.com", "google-analytics.com",
  "connect.facebook.net", "www.facebook.com", "facebook.com",
  "www.instagram.com", "instagram.com",
  "wa.me", "api.whatsapp.com",
  "www.youtube.com", "youtube.com", "youtu.be",
  "schema.org", "www.w3.org",
];

function stripTrackingParams(rawUrl) {
  try {
    const u = new URL(rawUrl);
    const toDelete = [];
    u.searchParams.forEach((_, key) => {
      if (key.startsWith("utm_") || ["sck", "fbclid", "gclid", "ttclid"].includes(key)) {
        toDelete.push(key);
      }
    });
    toDelete.forEach((k) => u.searchParams.delete(k));
    return u.toString();
  } catch {
    return rawUrl;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove("show"), 2200);
}

// ---------------------------------------------------------------------
// Análise do HTML colado
// ---------------------------------------------------------------------

function analyzeHtml(htmlText) {
  const doc = new DOMParser().parseFromString(htmlText, "text/html");

  const canonicalHref =
    doc.querySelector('link[rel="canonical"]')?.getAttribute("href") ||
    doc.querySelector('meta[property="og:url"]')?.getAttribute("content") ||
    null;

  let canonicalDomain = null;
  const baseForResolving = "https://pagina-analisada.invalid/";
  if (canonicalHref) {
    try { canonicalDomain = new URL(canonicalHref, baseForResolving).hostname; } catch {}
  }

  const anchors = Array.from(doc.querySelectorAll("a[href]"));

  // mapa texto -> conjunto de destinos (pra checar ambiguidade)
  const textToHrefs = new Map();
  for (const a of anchors) {
    const text = extractButtonText(a);
    if (!text) continue;
    let resolved;
    try { resolved = new URL(a.getAttribute("href"), canonicalHref || baseForResolving).href; } catch { continue; }
    const set = textToHrefs.get(text) || new Set();
    set.add(resolved);
    textToHrefs.set(text, set);
  }

  // links externos, agrupados por domínio
  const byDomain = new Map();
  for (const a of anchors) {
    let url;
    try { url = new URL(a.getAttribute("href"), canonicalHref || baseForResolving); } catch { continue; }
    if (url.protocol !== "http:" && url.protocol !== "https:") continue;
    if (canonicalDomain && url.hostname === canonicalDomain) continue;
    if (NOISE_DOMAINS.includes(url.hostname)) continue;
    const text = extractButtonText(a);
    const list = byDomain.get(url.hostname) || [];
    list.push({ href: url.href, text });
    byDomain.set(url.hostname, list);
  }

  let checkoutDomain = null;
  for (const domain of byDomain.keys()) {
    if (KNOWN_GATEWAYS.some((g) => domain === g || domain.endsWith("." + g))) {
      if (!checkoutDomain || byDomain.get(domain).length > byDomain.get(checkoutDomain).length) {
        checkoutDomain = domain;
      }
    }
  }
  if (!checkoutDomain) {
    let best = null;
    for (const [domain, list] of byDomain.entries()) {
      if (!best || list.length > byDomain.get(best).length) best = domain;
    }
    checkoutDomain = best;
  }

  let checkoutUrl = null;
  let candidateTexts = [];
  const ambiguousTexts = [];

  if (checkoutDomain) {
    const links = byDomain.get(checkoutDomain);
    const hrefCounts = new Map();
    for (const l of links) hrefCounts.set(l.href, (hrefCounts.get(l.href) || 0) + 1);
    let bestHref = null;
    for (const [href, count] of hrefCounts.entries()) {
      if (!bestHref || count > hrefCounts.get(bestHref)) bestHref = href;
    }
    checkoutUrl = stripTrackingParams(bestHref);

    const seenTexts = new Set();
    for (const l of links) {
      if (!l.text || seenTexts.has(l.text)) continue;
      seenTexts.add(l.text);
      if (BAD_TEXT_RE.test(l.text)) continue; // seta/emoji: nunca oferecer
      const destinations = textToHrefs.get(l.text);
      if (destinations && destinations.size > 1) {
        ambiguousTexts.push(l.text);
      } else {
        candidateTexts.push(l.text);
      }
    }
  }

  return { canonicalDomain, checkoutUrl, candidateTexts, ambiguousTexts };
}

// ---------------------------------------------------------------------
// Validação em tempo real
// ---------------------------------------------------------------------

function validateAll() {
  const problems = [];
  state.sites.forEach((site, i) => {
    const label = site.name || `Site #${i + 1}`;
    if (!site.name) problems.push(`${label}: nome do site não preenchido.`);
    if (!site.domain) problems.push(`${label}: domínio não preenchido.`);
    if (!site.expected_ip) problems.push(`${label}: IP esperado não preenchido.`);
    if (!site.checkout_url) problems.push(`${label}: link de checkout não preenchido.`);

    const withTexts = site.content_checks.filter((c) => c.expected_texts.some((t) => t.trim()));
    if (withTexts.length === 0) {
      problems.push(`${label}: nenhum monitor tem texto esperado preenchido.`);
    }
    withTexts.forEach((c) => {
      if (!c.url.trim()) {
        problems.push(`${label}: o monitor de ${labelDevice(c.device)} tem texto mas não tem o endereço da página preenchido.`);
      }
    });
    const devicesWithTexts = new Set(withTexts.map((c) => c.device));
    if (devicesWithTexts.size === 1 && site.content_checks.length > 1) {
      const missing = site.content_checks.find((c) => !devicesWithTexts.has(c.device));
      if (missing) problems.push(`${label}: só o ${labelDevice(withTexts[0].device)} tem texto — o ${labelDevice(missing.device)} fica sem vigilância.`);
    }

    site.content_checks.forEach((c) => {
      c.expected_texts.forEach((t) => {
        if (t && BAD_TEXT_RE.test(t)) {
          problems.push(`${label}: o texto "${t}" (${labelDevice(c.device)}) tem seta/ícone/emoji e vai falhar sempre.`);
        }
      });
    });
  });

  const panel = document.getElementById("warnings");
  if (problems.length === 0) {
    panel.className = "warnings ok";
    panel.innerHTML = "✓ Nenhum aviso — a configuração parece pronta pra exportar.";
  } else {
    panel.className = "warnings";
    panel.innerHTML = `<strong>${problems.length} aviso(s):</strong><ul>${problems.map((p) => `<li>${escapeHtml(p)}</li>`).join("")}</ul>`;
  }
}

function labelDevice(d) { return d === "mobile" ? "celular" : "computador"; }

// ---------------------------------------------------------------------
// Renderização
// ---------------------------------------------------------------------

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  state.sites.forEach((site, i) => {
    const tab = document.createElement("div");
    tab.className = "tab" + (i === state.active ? " active" : "");
    tab.textContent = site.name || `Site #${i + 1}`;
    tab.onclick = () => { state.active = i; renderAll(); };
    tabs.appendChild(tab);
  });
  const add = document.createElement("div");
  add.className = "tab add";
  add.textContent = "+ Novo site";
  add.onclick = () => {
    state.sites.push(newSite(""));
    state.active = state.sites.length - 1;
    renderAll();
  };
  tabs.appendChild(add);
}

function field(labelText, helpText, inputEl) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  const label = document.createElement("label");
  label.innerHTML = `${escapeHtml(labelText)} <span class="help" title="${escapeHtml(helpText)}">i</span>`;
  wrap.appendChild(label);
  wrap.appendChild(inputEl);
  return wrap;
}

function textInput(value, onInput, placeholder) {
  const input = document.createElement("input");
  input.type = "text";
  input.value = value || "";
  if (placeholder) input.placeholder = placeholder;
  input.oninput = () => onInput(input.value);
  return input;
}

function renderSitePanel() {
  const container = document.getElementById("site-panel");
  container.innerHTML = "";
  const site = state.sites[state.active];
  if (!site) return;

  const panel = document.createElement("div");
  panel.className = "panel";

  const h2 = document.createElement("h2");
  h2.textContent = "Dados do site";
  if (state.sites.length > 1) {
    const del = document.createElement("button");
    del.className = "small del-site";
    del.textContent = "Remover este site";
    del.onclick = () => {
      if (!confirm(`Remover "${site.name || "este site"}" da configuração?`)) return;
      state.sites.splice(state.active, 1);
      state.active = Math.max(0, state.active - 1);
      renderAll();
    };
    h2.appendChild(del);
  }
  panel.appendChild(h2);

  panel.appendChild(field(
    "Nome do site",
    "Só pra você identificar nas abas e nos alertas. Ex: Acervo do Nutri.",
    textInput(site.name, (v) => { site.name = v; renderTabs(); validateAll(); }, "Ex: Acervo do Nutri")
  ));

  const domainInputEl = textInput(site.domain, (v) => { site.domain = v; validateAll(); }, "acervodonutri.com");
  domainInputEl.id = "field-domain";
  panel.appendChild(field(
    "Domínio",
    "O domínio principal, sem https:// e sem www. Ex: acervodonutri.com",
    domainInputEl
  ));

  panel.appendChild(field(
    "IP esperado",
    "Abra whatsmydns.net, digite seu domínio, escolha o tipo A, e veja o IP que se repete na maioria dos locais.",
    textInput(site.expected_ip, (v) => { site.expected_ip = v; validateAll(); }, "147.79.84.105")
  ));

  const checkoutInputEl = textInput(site.checkout_url, (v) => { site.checkout_url = v; validateAll(); }, "https://pay.kiwify.com.br/xxxxx");
  checkoutInputEl.id = "field-checkout";
  panel.appendChild(field(
    "Link do checkout",
    "O link que o botão de comprar abre (ex: link do Kiwify, Hotmart etc.), sem parâmetros de rastreamento.",
    checkoutInputEl
  ));

  const sslInput = document.createElement("input");
  sslInput.type = "number";
  sslInput.min = "1";
  sslInput.value = site.ssl_alert_days;
  sslInput.oninput = () => { site.ssl_alert_days = Number(sslInput.value) || 20; };
  panel.appendChild(field(
    "Avisar sobre o certificado de segurança (SSL) com quantos dias de antecedência",
    "Quantos dias antes do vencimento do certificado você quer ser avisado. 20 é um bom padrão.",
    sslInput
  ));

  panel.appendChild(field(
    "Link da bio do Instagram",
    "O link completo que está na bio do seu Instagram (com os parâmetros de rastreamento, se tiver).",
    textInput(site.instagram_bio_url, (v) => { site.instagram_bio_url = v; validateAll(); }, "https://www.seudominio.com/?utm_source=bio...")
  ));

  panel.appendChild(field(
    "Domínio esperado ao final do link da bio",
    "Pra onde esse link deveria terminar levando. Normalmente é o mesmo domínio do site.",
    textInput(site.instagram_bio_expected_domain, (v) => { site.instagram_bio_expected_domain = v; }, site.domain || "acervodonutri.com")
  ));

  container.appendChild(panel);
  const contentPanel = renderContentChecksPanel(site);
  contentPanel.id = "content-checks-panel";
  container.appendChild(contentPanel);
  container.appendChild(renderAdLinksPanel(site));
  container.appendChild(renderPastePanel(site));
}

// Reconstrói só o painel de "conteúdo da página" no lugar, sem mexer no
// resto (em especial sem apagar a caixa de análise com os outros achados
// ainda não confirmados).
function refreshContentChecksPanel(site) {
  const old = document.getElementById("content-checks-panel");
  if (!old) return;
  const fresh = renderContentChecksPanel(site);
  fresh.id = "content-checks-panel";
  old.replaceWith(fresh);
}

function renderContentChecksPanel(site) {
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `<h2>Conteúdo da página (o que o botão de comprar precisa ter)</h2>
    <p class="panel-hint">Pra cada versão (celular e computador), liste os textos exatos que precisam continuar existindo no site — normalmente o texto do(s) botão(ões) de compra e o próprio link de checkout.</p>`;

  site.content_checks.forEach((check) => {
    const sub = document.createElement("div");
    sub.className = "subsection";
    const title = check.device === "mobile" ? "Versão celular" : "Versão computador";
    sub.innerHTML = `<h3>${title}</h3>`;

    const urlField = field(
      "Endereço da página",
      "A URL da página que vai ser verificada nessa versão.",
      textInput(check.url, (v) => { check.url = v; }, "https://" + (site.domain || "seudominio.com") + "/")
    );
    sub.appendChild(urlField);

    const listWrap = document.createElement("div");
    listWrap.appendChild(document.createElement("label")).innerHTML =
      'Textos que precisam existir <span class="help" title="Cole o texto exatamente como aparece no botão. Nunca use setas/ícones/emoji, e nunca um texto que se repita na página apontando pra lugares diferentes.">i</span>';

    function renderTextRows() {
      Array.from(listWrap.querySelectorAll(".text-row-block")).forEach((el) => el.remove());
      check.expected_texts.forEach((text, idx) => {
        const block = document.createElement("div");
        block.className = "text-row-block";

        const row = document.createElement("div");
        row.className = "text-list-row";
        const input = document.createElement("input");
        input.type = "text";
        input.value = text;
        input.placeholder = "Ex: Comprar agora por R$ 97,00";
        input.oninput = () => { check.expected_texts[idx] = input.value; refreshBadWarning(); validateAll(); };
        row.appendChild(input);

        const removeBtn = document.createElement("button");
        removeBtn.className = "subtle";
        removeBtn.textContent = "✕";
        removeBtn.title = "Remover este texto";
        removeBtn.onclick = () => {
          check.expected_texts.splice(idx, 1);
          if (check.expected_texts.length === 0) check.expected_texts.push("");
          renderTextRows();
          validateAll();
        };
        row.appendChild(removeBtn);
        block.appendChild(row);

        const warn = document.createElement("div");
        warn.className = "bad-text-warning";
        block.appendChild(warn);

        function refreshBadWarningLocal() {
          warn.textContent = BAD_TEXT_RE.test(input.value) ? "⚠ contém seta/ícone/emoji — vai falhar sempre" : "";
        }
        input.addEventListener("input", refreshBadWarningLocal);
        refreshBadWarningLocal();

        listWrap.appendChild(block);
      });
    }
    function refreshBadWarning() {} // placeholder, warnings são por linha
    renderTextRows();

    const addBtn = document.createElement("button");
    addBtn.className = "small";
    addBtn.textContent = "+ Adicionar texto";
    addBtn.style.marginTop = "4px";
    addBtn.onclick = () => { check.expected_texts.push(""); renderTextRows(); };
    listWrap.appendChild(addBtn);

    sub.appendChild(listWrap);
    panel.appendChild(sub);
  });

  return panel;
}

function renderAdLinksPanel(site) {
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `<h2>Links de anúncio (opcional)</h2>
    <p class="panel-hint">Cole aqui os links que você usa em campanhas com parâmetros de rastreamento (UTM), pra confirmar que eles não se perdem no meio do caminho. Se usar o Gerenciador de Anúncios da Meta, pode deixar as macros tipo <code>{{campaign.name}}</code> como estão — o sistema troca por um valor de teste automaticamente.</p>`;

  const list = document.createElement("div");

  function renderRows() {
    list.innerHTML = "";
    site.ad_links.forEach((link, idx) => {
      const row = document.createElement("div");
      row.className = "subsection";

      const nameInput = textInput(link.name, (v) => { link.name = v; }, "Ex: Meta Ads");
      row.appendChild(field("Nome (só pra identificar)", "Um nome curto pra você reconhecer esse link nos alertas.", nameInput));

      const urlInput = textInput(link.url, (v) => { link.url = substituteMetaMacros(v); urlInput.value = link.url; }, "https://seudominio.com/?utm_source=FB&utm_campaign={{campaign.name}}...");
      row.appendChild(field("Link completo com os parâmetros UTM", "O link exatamente como está configurado no anúncio.", urlInput));

      const removeBtn = document.createElement("button");
      removeBtn.className = "small subtle";
      removeBtn.textContent = "Remover este link";
      removeBtn.onclick = () => { site.ad_links.splice(idx, 1); renderRows(); };
      row.appendChild(removeBtn);

      list.appendChild(row);
    });
  }
  renderRows();
  panel.appendChild(list);

  const addBtn = document.createElement("button");
  addBtn.className = "small";
  addBtn.textContent = "+ Adicionar link de anúncio";
  addBtn.onclick = () => { site.ad_links.push({ name: "", url: "" }); renderRows(); };
  panel.appendChild(addBtn);

  return panel;
}

function substituteMetaMacros(url) {
  return url.replace(/\{\{[^}]+\}\}/g, "teste");
}

function renderPastePanel(site) {
  const panel = document.createElement("div");
  panel.className = "panel paste-box";
  panel.innerHTML = `<h2>Detectar automaticamente (opcional)</h2>
    <p class="panel-hint">Abra a página do site no navegador, aperte Ctrl+U (ou clique com o botão direito → "Ver código-fonte"), copie tudo (Ctrl+A, Ctrl+C) e cole aqui embaixo. Nada é enviado pra lugar nenhum — a análise acontece só no seu navegador.</p>`;

  const textarea = document.createElement("textarea");
  textarea.placeholder = "Cole aqui o código-fonte (HTML) da página...";
  panel.appendChild(textarea);

  const analyzeBtn = document.createElement("button");
  analyzeBtn.className = "primary small";
  analyzeBtn.style.marginTop = "10px";
  analyzeBtn.textContent = "Analisar";
  panel.appendChild(analyzeBtn);

  const resultsWrap = document.createElement("div");
  panel.appendChild(resultsWrap);

  analyzeBtn.onclick = () => {
    const html = textarea.value;
    if (!html.trim()) { showToast("Cole o código-fonte antes de analisar."); return; }
    const result = analyzeHtml(html);
    renderFindings(resultsWrap, site, result);
  };

  return panel;
}

function renderFindings(container, site, result) {
  container.innerHTML = "<h3 style='font-size:14px;margin-top:18px;'>Resultado da análise</h3>";

  if (result.canonicalDomain) {
    container.appendChild(makeFinding(
      `Domínio detectado: <code>${escapeHtml(result.canonicalDomain)}</code>`,
      () => {
        site.domain = result.canonicalDomain;
        const el = document.getElementById("field-domain");
        if (el) el.value = site.domain;
        validateAll();
        showToast("Domínio preenchido.");
      },
      false
    ));
  } else {
    container.appendChild(makeInfoLine("Não consegui identificar o domínio canônico dessa página (procurei por &lt;link rel=canonical&gt;). Preencha o domínio manualmente."));
  }

  if (result.checkoutUrl) {
    container.appendChild(makeFinding(
      `Link de checkout detectado: <code>${escapeHtml(result.checkoutUrl)}</code> (já sem parâmetros de rastreamento)`,
      () => {
        site.checkout_url = result.checkoutUrl;
        const el = document.getElementById("field-checkout");
        if (el) el.value = site.checkout_url;
        site.content_checks.forEach((c) => {
          if (!c.expected_texts.includes(result.checkoutUrl)) {
            if (c.expected_texts.length === 1 && !c.expected_texts[0]) c.expected_texts[0] = result.checkoutUrl;
            else c.expected_texts.push(result.checkoutUrl);
          }
        });
        refreshContentChecksPanel(site);
        validateAll();
        showToast("Link de checkout preenchido e adicionado como texto obrigatório.");
      },
      false
    ));
  } else {
    container.appendChild(makeInfoLine("Não encontrei um link externo que pareça ser de checkout. Preencha manualmente."));
  }

  result.candidateTexts.forEach((text) => {
    container.appendChild(makeFinding(
      `Texto de botão encontrado apontando pro checkout: <code>${escapeHtml(text)}</code>`,
      () => {
        let added = false;
        site.content_checks.forEach((c) => {
          if (c.expected_texts.includes(text)) { added = true; return; }
          if (c.expected_texts.length === 1 && !c.expected_texts[0]) { c.expected_texts[0] = text; added = true; }
          else { c.expected_texts.push(text); added = true; }
        });
        refreshContentChecksPanel(site);
        validateAll();
        if (added) showToast("Texto adicionado nas duas versões (celular e computador).");
      },
      false
    ));
  });

  result.ambiguousTexts.forEach((text) => {
    const el = document.createElement("div");
    el.className = "finding ambiguous";
    el.innerHTML = `<div class="finding-text">⚠ O texto <code>${escapeHtml(text)}</code> aparece mais de uma vez na página, apontando pra destinos diferentes. Não incluí automaticamente — se quiser usar, adicione um texto mais específico à mão.</div>`;
    container.appendChild(el);
  });
}

function makeFinding(html, onAccept, done) {
  const el = document.createElement("div");
  el.className = "finding" + (done ? " done" : "");
  const text = document.createElement("div");
  text.className = "finding-text";
  text.innerHTML = html;
  el.appendChild(text);

  const actions = document.createElement("div");
  actions.className = "finding-actions";

  const acceptBtn = document.createElement("button");
  acceptBtn.className = "small primary";
  acceptBtn.textContent = "Está certo";
  acceptBtn.onclick = () => {
    onAccept();
    el.classList.add("done");
    actions.innerHTML = "";
    const doneLabel = document.createElement("span");
    doneLabel.textContent = "✓ aplicado";
    doneLabel.style.color = "var(--ok)";
    doneLabel.style.fontSize = "13px";
    actions.appendChild(doneLabel);
  };

  const rejectBtn = document.createElement("button");
  rejectBtn.className = "small";
  rejectBtn.textContent = "Corrigir à mão";
  rejectBtn.onclick = () => {
    el.classList.add("done");
    actions.innerHTML = "";
    const doneLabel = document.createElement("span");
    doneLabel.textContent = "ignorado — edite o campo manualmente";
    doneLabel.style.color = "var(--text-muted)";
    doneLabel.style.fontSize = "13px";
    actions.appendChild(doneLabel);
  };

  actions.appendChild(acceptBtn);
  actions.appendChild(rejectBtn);
  el.appendChild(actions);
  return el;
}

function makeInfoLine(text) {
  const el = document.createElement("div");
  el.className = "finding";
  el.innerHTML = `<div class="finding-text">${escapeHtml(text)}</div>`;
  return el;
}

function renderAll() {
  renderTabs();
  renderSitePanel();
  validateAll();
}

// ---------------------------------------------------------------------
// Exportar / carregar
// ---------------------------------------------------------------------

function buildConfig() {
  return {
    sites: state.sites.map((site) => ({
      name: site.name,
      domain: site.domain,
      expected_ip: site.expected_ip,
      checkout_url: site.checkout_url,
      ssl_alert_days: Number(site.ssl_alert_days) || 20,
      content_checks: site.content_checks.map((c) => ({
        device: c.device,
        url: c.url,
        expected_texts: c.expected_texts.filter((t) => t.trim()),
      })),
      instagram_bio_url: site.instagram_bio_url || undefined,
      instagram_bio_expected_domain: site.instagram_bio_expected_domain || undefined,
      ad_links: site.ad_links.filter((l) => l.url.trim()),
    })),
  };
}

document.getElementById("btn-copy").onclick = async () => {
  const json = JSON.stringify(buildConfig(), null, 2);
  try {
    await navigator.clipboard.writeText(json);
    showToast("JSON copiado.");
  } catch {
    showToast("Não consegui copiar automaticamente — selecione e copie na mão.");
  }
};

document.getElementById("btn-download").onclick = () => {
  const json = JSON.stringify(buildConfig(), null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "config.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
};

document.getElementById("btn-load").onclick = () => document.getElementById("load-input").click();

document.getElementById("load-input").onchange = (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed.sites)) throw new Error("formato inesperado");
      state.sites = parsed.sites.map((s) => {
        const base = newSite(s.name);
        return Object.assign(base, s, {
          content_checks: (s.content_checks && s.content_checks.length ? s.content_checks : base.content_checks)
            .map((c) => ({ device: c.device, url: c.url || "", expected_texts: (c.expected_texts && c.expected_texts.length ? c.expected_texts.slice() : [""]) })),
          ad_links: s.ad_links ? s.ad_links.map((l) => ({ name: l.name || "", url: l.url || "" })) : [],
        });
      });
      state.active = 0;
      renderAll();
      showToast("Configuração carregada.");
    } catch (e) {
      alert("Não consegui ler esse arquivo como config.json válido: " + e.message);
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
};

renderAll();
</script>
